    <title>Jauhi Zina - Edukasi Islami</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        body {
            background-color: #e8f5e9; /* Hijau Soft */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(46, 125, 50, 0.15);
            max-width: 440px;
            width: 100%;
            text-align: center;
            border-top: 6px solid #2e7d32;
        }

        .sticker-header {
            font-size: 48px;
            margin-bottom: 12px;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        h2 {

            font-size: 22px;
            margin-bottom: 8px;
        }

            margin-bottom: 24px;
            font-weight: 600;
        }

            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

            padding: 14px;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-pacaran {
            background-color: #e57373;
            color: white;
        }
